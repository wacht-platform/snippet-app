name: snippet
description: "Remote control client (Android + macOS) for the snippet coding agent."
publish_to: 'none'
repository: https://github.com/wacht-platform/snippet-app
version: 1.0.0-alpha.8+107

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.7.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  flutter_zxing: ^2.3.0
  permission_handler: ^13.0.1
  record: ^7.1.1
  silero_vad:
    path: packages/silero_vad
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.2.2
  flutter_local_notifications: ^22.0.1
  workmanager: ^0.10.9
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  hugeicons: ^1.1.7
  lucide_icons_flutter: 3.1.14+2
  flutter_svg: 2.3.0
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  media_store_plus: ^0.1.3
  open_filex: ^4.7.0
  video_player: ^2.11.1
  chewie: ^1.13.1
  audioplayers: ^6.8.1
  xterm: ^4.0.0
  pasteboard: ^0.5.0
  webview_flutter: ^4.14.1
  flutter_foreground_task: ^11.0.3
  ambient_audio:
    path: packages/ambient_audio
  flutter_soloud: ^4.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  stream_channel: ^2.1.2

