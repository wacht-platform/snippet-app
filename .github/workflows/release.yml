name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snippet-release
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore shared keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snippet.keystore"
            echo "SNIPPET_KEYSTORE=$RUNNER_TEMP/snippet.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set; this APK will use a generated signing key."
          fi
      - name: Build arm64 APK
        run: flutter build apk --release --split-per-abi
      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk snippet-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: snippet-android-arm64.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build macos --release
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/snippet.app snippet-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: snippet-macos.zip
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "snippet-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: snippet-windows.zip
          if-no-files-found: error

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build linux --release
      - name: Stage launcher and desktop entry
        run: |
          cat << 'EOF' > build/linux/x64/release/bundle/snippet.sh
          #!/usr/bin/env bash
          set -e
          PRG="$0"
          while [ -h "$PRG" ]; do
            ls=$(ls -ld "$PRG")
            link=$(expr "$ls" : '.*-> \(.*\)$')
            if expr "$link" : '/.*' > /dev/null; then
              PRG="$link"
            else
              PRG="$(dirname "$PRG")/$link"
            fi
          done
          DIR="$(cd "$(dirname "$PRG")" && pwd)"

          export LD_LIBRARY_PATH="${DIR}/lib:${LD_LIBRARY_PATH:-}"
          exec "${DIR}/snippet" "$@"
          EOF
          chmod +x build/linux/x64/release/bundle/snippet.sh

          cat << 'EOF' > build/linux/x64/release/bundle/snippet.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Snippet
          GenericName=Coding Agent Client
          Comment=Remote control client for the snippet coding agent
          Exec=snippet.sh
          Icon=snippet
          Terminal=false
          Categories=Development;Utility;
          StartupNotify=true
          StartupWMClass=snippet
          EOF
          chmod 644 build/linux/x64/release/bundle/snippet.desktop

          cp assets/icon.png build/linux/x64/release/bundle/snippet.png
      - name: Package Linux app
        run: tar -czf snippet-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: snippet-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest snippet app
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Latest development build from `${{ github.sha }}`.

            Assets:
            - `snippet-android-arm64.apk` — Android arm64
            - `snippet-macos.zip` — macOS app
            - `snippet-windows.zip` — Windows app
            - `snippet-linux-x64.tar.gz` — Linux desktop x64 (universal portable archive)
          files: release-assets/*
