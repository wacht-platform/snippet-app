name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snippet-release
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore shared keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snippet.keystore"
            echo "SNIPPET_KEYSTORE=$RUNNER_TEMP/snippet.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is not set; this APK will use a generated signing key."
          fi
      - name: Build arm64 APK
        run: flutter build apk --release --split-per-abi
      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk snippet-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: snippet-android-arm64.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build macos --release
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/snippet.app snippet-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: snippet-macos.zip
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "snippet-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: snippet-windows.zip
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest snippet app
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Latest development build from `${{ github.sha }}`.

            Assets:
            - `snippet-android-arm64.apk` — Android arm64
            - `snippet-macos.zip` — macOS app
            - `snippet-windows.zip` — Windows app
          files: release-assets/*
